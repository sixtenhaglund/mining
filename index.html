  // --- The Void ---
  { layer: 3, name: "Void stone",          d: 0,     gold: 750000,        rarity: "Common",       color: "#3a2a55" },
  { layer: 3, name: "Nullium crystal",     d: 3,     gold: 3000000,       rarity: "Uncommon",     color: "#5a5a80" },
  { layer: 3, name: "Echoium crystal",     d: 6,     gold: 7500000,       rarity: "Rare",         color: "#8a7aff" },

  { layer: 3, name: "Riftium crystal",     d: 60,    gold: 350000000,     rarity: "Mythical",     color: "#ff40ff" },
  { layer: 3, name: "Eternium crystal",    d: 150,   gold: 1500000000,     rarity: "Angelic",      color: "#b0fff0" },
  { layer: 3, name: "Starbleed crystal",   d: 400,   gold: 7500000000,    rarity: "Celestial",    color: "#6070ff" },
  { layer: 3, name: "Transium crystal",    d: 1200,  gold: 35000000000,   rarity: "Transcendant", color: "#101010" },
  { layer: 3, name: "Secretium crystal",   d: 4000,  gold: 150000000000,   rarity: "Secret",       color: "#a00000" },
  { layer: 3, name: "Adminium crystal",    d: 12000, gold: 750000000000,  rarity: "Admin",        color: "#e0e0e0" },
  // --- The Core (only one, from breaking the Core) ---
  { layer: 4, name: "Core crystal",        d: -1,    gold: 10000000000000,         rarity: "Admin",        color: "#ffcc33" },

MINERALS.forEach((m, i) => { m.id = i; if (!m.costume) m.costume = "new/mineral_" + m.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".svg"; });
const LAYER_MINERALS = LAYERS.map((_, L) => MINERALS.filter(m => m.layer === L));
const CORE_MINERAL = MINERALS.length - 1;

// Real chance of each mineral in its layer (for the index)
const CHANCE = (() => {
  const p = new Array(MINERALS.length).fill(0);
  for (const list of LAYER_MINERALS) {
    let left = 1;
    for (const m of list) if (m.d > 0) { p[m.id] = left / m.d; left -= p[m.id]; }
    const rock = list.find(m => m.d === 0);
    if (rock) p[rock.id] = left;
  }
  return p;
})();

// His if-chain: try each mineral top to bottom, else the plain rock.
function rollOnce(layer, rand) {
  const list = LAYER_MINERALS[layer];
  for (const m of list) if (m.d > 0 && Math.floor(rand() * m.d) + 1 === m.d) return m.id;
  return list[0].id;
}
// Luck = extra rolls, keep the rarest (the one furthest down his list)
function rollMineral(layer, rolls, rand) {
  let best = rollOnce(layer, rand);
  for (let i = 1; i < rolls; i++) { const r = rollOnce(layer, rand); if (r > best) best = r; }
  return best;
}


// ---- Shop. The depth-0 entries of mult/speed/drill are HIS upgrades. ----
// depth = how deep you must have dug before that tier shows up, so the
// Rock Cave shop is exactly his, and every new depth unlocks new things.
const UPG = {
  mult: [ // Upgrades 1
    { cost: 50, v: 2 }, { cost: 150, v: 4 }, { cost: 250, v: 8 }, { cost: 500, v: 10 },
    { cost: 1000, v: 20 }, { cost: 2500, v: 50 }, { cost: 10000, v: 100 },
    { cost: 5e7, v: 250, depth: 1 }, { cost: 3e10, v: 500, depth: 2 },
    { cost: 1e13, v: 1000, depth: 3 }, { cost: 5e14, v: 2500, depth: 3 },
  ],
  speed: [ // Upgrades 2  (mining = swing half-time, breaking = wait between hits)
    { cost: 50, mining: 0.45, breaking: 0.9 }, { cost: 100, mining: 0.375, breaking: 0.75 },
    { cost: 350, mining: 0.25, breaking: 0.5 }, { cost: 800, mining: 0.05, breaking: 0.1 },
    { cost: 2000, mining: 0, breaking: 0.00001 },
  ],
  drill: [ // his Drill MK 1-4 (from his button text) + new ones
    { cost: 100, v: 5 }, { cost: 350, v: 10 }, { cost: 500, v: 20 }, { cost: 1500, v: 50 },
    { cost: 3e7, v: 5000, depth: 1, label: "Drill MK 5" },
    { cost: 3e9, v: 200000, depth: 2, label: "Drill MK 6" },
    { cost: 3e11, v: 5000000, depth: 2, label: "Drill MK 7" },
    { cost: 1e13, v: 500000000, depth: 3, label: "Drill MK 8" },
    { cost: 3e14, v: 20000000000, depth: 3, label: "Drill MK 9" },
  ],
  pick: [ // pickaxe power = rock damage per hit
    { cost: 1e7, v: 2, depth: 1, label: "Iron pickaxe" },
    { cost: 5e8, v: 3, depth: 1, label: "Steel pickaxe" },
    { cost: 5e9, v: 4, depth: 2, label: "Gold pickaxe" },
    { cost: 3e12, v: 5, depth: 3, label: "Diamond pickaxe" },
    { cost: 1e15, v: 7, depth: 3, label: "Rektium pickaxe" },
  ],
  crit: [ // chance for a hit to do 4x damage
    { cost: 2e8, v: 0.1, depth: 1, label: "Sharp eye I" },
    { cost: 2e10, v: 0.15, depth: 2, label: "Sharp eye II" },
    { cost: 1e13, v: 0.2, depth: 3, label: "Sharp eye III" },
    { cost: 3e14, v: 0.25, depth: 3, label: "Sharp eye IV" },
  ],
  luck: [ // extra rolls per rock, keep the rarest
    { cost: 3e6, v: 2, depth: 1, label: "Lucky charm I" },
    { cost: 1e10, v: 3, depth: 2, label: "Lucky charm II" },
    { cost: 5e12, v: 4, depth: 3, label: "Lucky charm III" },
    { cost: 3e14, v: 5, depth: 3, label: "Lucky charm IV" },
  ],
  helper: [ // mini miners that hit the rock on their own (hits per second, all together)
    { cost: 2e7, v: 1, depth: 1, label: "Mini miner I" },
    { cost: 5e9, v: 2, depth: 2, label: "Mini miner II" },
    { cost: 3e12, v: 4, depth: 3, label: "Mini miner III" },
    { cost: 5e14, v: 8, depth: 3, label: "Mini miner IV" },
  ],
  event: [ // events last longer and come more often
    { cost: 3e8, v: 1, depth: 1, label: "Lucky lantern I" },
    { cost: 1e11, v: 2, depth: 2, label: "Lucky lantern II" },
    { cost: 1e14, v: 3, depth: 3, label: "Lucky lantern III" },
  ],
  gear: [ // one piece of gear for each depth
    { cost: 2e8, v: 1, depth: 1, label: "Frost boots", sub: "x2 gold in the Deep Cave" },
    { cost: 2e11, v: 2, depth: 2, label: "Heat suit", sub: "x2 gold in the Magma Depths" },
    { cost: 1e14, v: 3, depth: 3, label: "Void goggles", sub: "x2 gold + 1 luck roll in The Void" },
    { cost: 3e14, v: 4, depth: 3, label: "Core gloves", sub: "x2 damage on The Core" },
  ],
};
const UPG_KEYS = Object.keys(UPG);
const BASE_SPEED = { mining: 0.48, breaking: 0.96 };
const BREAK_PAUSE_TICKS = 3;          // his "wait 0.1" before the new rock
const RUSH_MULT = 3;
const CRIT_MULT = 4;

// ---- Boss rocks: every 60 rocks in a new depth (never in his Rock Cave) ----
const BOSS_EVERY = 60;
const BOSSES = [null,
  { name: "The Big Basalt", hpMul: 12, skin: "frost" },
  { name: "Magma King",     hpMul: 12, skin: "magma" },
  { name: "The Void Eye",   hpMul: 12, skin: "void" },
];
// ---- Rebirth perks, bought with Rebirth stars (3 per rebirth) ----
const STARS_PER_REBIRTH = 3;
const PERKS = [
  { id: "golden", name: "Golden touch", desc: "+50% gold per level", max: 5, cost: 1 },
  { id: "power",  name: "Strong arms",  desc: "+1 pickaxe damage per level", max: 3, cost: 1 },
  { id: "start",  name: "Head start",   desc: "Start a run with 10K / 1M / 100M gold", max: 3, cost: 1 },
  { id: "helper", name: "Old friend",   desc: "Start with Mini miner I", max: 1, cost: 1 },
  { id: "luck",   name: "Lucky soul",   desc: "+1 luck roll per level", max: 2, cost: 2 },
  { id: "dig",    name: "Shortcut",     desc: "Digging deeper costs 25% less per level", max: 2, cost: 2 },
];
const START_GOLD = [0, 1e4, 1e6, 1e8];

function newSave() {
  const s = {
    v: 3, gold: 0, high: 0, layer: 0, maxLayer: 0, coreHP: CORE_HP, coreBroken: false, rebirths: 0,
    found: new Array(MINERALS.length).fill(0), rocks: 0, police: false, quotas: 0,
    ach: {}, time: 0, totalGold: 0, boulders: 0, ended: false,
    depthRocks: [0, 0, 0, 0, 0], bossKills: [0, 0, 0, 0, 0], bossNext: -1, bossActive: -1,
    stars: 0, perks: {}, badges: 0, quests: [], questsDone: 0, skins: { classic: true }, skin: "classic",
    meteors: 0, crits: 0, tierFinds: new Array(RARITIES.length).fill(0),
  };
  for (const k of UPG_KEYS) s[k] = 0;
  return s;
}
const perk = (s, id) => (s.perks && s.perks[id]) || 0;
const lvl = (s, k) => s[k] === 0 ? null : UPG[k][s[k] - 1];
function goldMult(s)  { const u = lvl(s, "mult"); return u ? u.v : 1; }
function rebirthMult(s) { return Math.pow(2, s.rebirths) * (1 + 0.5 * perk(s, "golden")); }
function gearMult(s, layer) { return (s.gear >= 1 && layer === 1) || (s.gear >= 2 && layer === 2) || (s.gear >= 3 && layer === 3) ? 2 : 1; }
function speedOf(s)   { return lvl(s, "speed") || BASE_SPEED; }
function pickPower(s) { const u = lvl(s, "pick"); return (u ? u.v : 1) + perk(s, "power"); }
function critChance(s) { const u = lvl(s, "crit"); return u ? u.v : 0; }
function luckRolls(s) { const u = lvl(s, "luck"); return (u ? u.v : 1) + perk(s, "luck") + (s.gear >= 3 && s.layer === 3 ? 1 : 0); }
function helperHPS(s) { const u = lvl(s, "helper"); return u ? u.v : 0; }
function eventBoost(s) { return s.event; }   // 0..3: +25% duration and +15% frequency per level
function drillPPS(s)  { let t = 0; for (let i = 0; i < s.drill; i++) t += UPG.drill[i].v; return t * rebirthMult(s); }
function hitInterval(s) { return speedOf(s).breaking + DT; }
function tierLocked(s, k) { const n = UPG[k][s[k]]; return !!(n && (n.depth || 0) > s.maxLayer); }
function nextCost(s, k) {
  if (k === "dig") return s.maxLayer + 1 < LAYERS.length ? LAYERS[s.maxLayer + 1].cost * (1 - 0.25 * perk(s, "dig")) : Infinity;
  if (s[k] >= UPG[k].length || tierLocked(s, k)) return Infinity;
  return UPG[k][s[k]].cost;
}
function canBuy(s, k) { return s.gold >= nextCost(s, k); }
function buy(s, k) {
  if (!canBuy(s, k)) return false;
  s.gold -= nextCost(s, k);
  if (k === "dig") { s.maxLayer++; s.layer = s.maxLayer; } else s[k]++;
  return true;
}
const GOLD_CAP = 1e300;   // far past anything reachable, but never Infinity (which would break saving)
function addGold(s, n) { if (!(n > 0)) return; s.gold = Math.min(GOLD_CAP, s.gold + n); s.totalGold = Math.min(GOLD_CAP, s.totalGold + n); if (s.gold > s.high) s.high = s.gold; }
function bossHP(L) { return LAYERS[L].hp * BOSSES[L].hpMul; }
function rockHP(s, boss) { return LAYERS[s.layer].core ? s.coreHP : boss ? bossHP(s.layer) : LAYERS[s.layer].hp; }
// one pickaxe hit: returns the damage (crits do 4x)
function hitDamage(s, rand, frenzy) {
  let d = pickPower(s) * (frenzy ? 2 : 1);
  if (LAYERS[s.layer].core && s.gear >= 4) d *= 2;
  const crit = rand() < critChance(s);
  if (crit) { d *= CRIT_MULT; s.crits++; }
  return { d, crit };
}
// payout for a mineral right now
function payout(s, id, rush) { return MINERALS[id].gold * goldMult(s) * rebirthMult(s) * gearMult(s, MINERALS[id].layer) * (rush ? RUSH_MULT : 1); }
function noteFind(s, id) { s.found[id]++; s.tierFinds[tierOf(MINERALS[id].rarity)]++; }
function breakRock(s, rand, opts = {}) {
  const id = rollMineral(s.layer, luckRolls(s) + (opts.vein ? 2 : 0), rand);
  addGold(s, payout(s, id, opts.rush));
  noteFind(s, id);
  s.rocks++;
  s.depthRocks[s.layer]++;
  if (s.layer >= 1 && s.layer <= 3 && s.depthRocks[s.layer] % BOSS_EVERY === 0) s.bossNext = s.layer;
  return id;
}
// boss loot: 5 minerals rolled with +3 luck
function bossLoot(s, rand) {
  const ids = [];
  for (let i = 0; i < 5; i++) { const id = rollMineral(s.layer, luckRolls(s) + 3, rand); ids.push(id); addGold(s, payout(s, id, false)); noteFind(s, id); }
  s.bossKills[s.layer]++;
  s.rocks++;
  return ids;
}
function rebirth(s) {
  const keep = {
    found: s.found, ach: s.ach, rebirths: s.rebirths + 1, high: s.high, police: true, quotas: s.quotas, time: s.time,
    totalGold: s.totalGold, boulders: s.boulders, rocks: s.rocks, ended: s.ended, bossKills: s.bossKills,
    stars: s.stars + STARS_PER_REBIRTH, perks: s.perks, badges: s.badges, quests: s.quests, questsDone: s.questsDone,
    skins: s.skins, skin: s.skin, meteors: s.meteors, crits: s.crits, tierFinds: s.tierFinds,
  };
  const n = Object.assign(newSave(), keep);
  applyStartPerks(n);
  return n;
}
function applyStartPerks(s) {
  s.gold = Math.max(s.gold, START_GOLD[perk(s, "start")]);
  if (perk(s, "helper") && s.helper < 1) s.helper = 1;
}
function buyPerk(s, id) {
  const p = PERKS.find(p => p.id === id); if (!p) return false;
  const l = perk(s, id); if (l >= p.max || s.stars < p.cost) return false;
  s.stars -= p.cost; s.perks[id] = l + 1;
  if (id === "start" || id === "helper") applyStartPerks(s);
  return true;
}
// ==/CORE==

// =====================================================================
// 2. HELPERS — maths, colours, random numbers, number formatting
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2)); };
// A "seeded" random generator: the same seed always gives the same numbers,
// so a mineral or rock looks the same every time we draw it.
function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) {
  return function () {

function cardInfo(k) {

// ---------- Rock police orders (quests) ----------
// Each order remembers the counter value when it was given ("base"),
// so progress = counter now - base.
const QUEST_KINDS = {
  rocks:   { badges: 1, count: s => s.rocks, text: q => `Break ${q.n} rocks` },
  tier:    { badges: 2, count: (s, q) => s.tierFinds.slice(q.tier).reduce((a, b) => a + b, 0), text: q => `Find ${q.n} ${RARITIES[q.tier]}+ mineral${q.n > 1 ? "s" : ""}` },
  gold:    { badges: 1, count: s => s.totalGold, text: q => `Earn ${fmt(q.n)} Gold` },
  falling: { badges: 2, count: s => s.boulders + s.meteors, text: q => `Smash ${q.n} cave-in rocks or meteors` },
  depth:   { badges: 1, count: (s, q) => s.depthRocks[q.L], text: q => `Break ${q.n} rocks in the ${LAYERS[q.L].name}` },
  boss:    { badges: 3, count: s => s.bossKills.reduce((a, b) => a + b, 0), text: () => "Defeat a boss rock" },
  crit:    { badges: 1, count: s => s.crits, text: q => `Land ${q.n} critical hits` },
};
function makeQuest() {
  const have = S.quests.map(q => q.type);
  const kinds = ["rocks", "tier", "gold", "falling", "depth"];
  if (S.maxLayer >= 1) kinds.push("boss");
  if (S.crit > 0) kinds.push("crit");
  const free = kinds.filter(k => !have.includes(k));
  const type = free[Math.floor(rand() * free.length)] || "rocks";
  const q = { type, n: 1, base: 0, L: Math.min(S.maxLayer, 3), tier: 2 };
  if (type === "rocks") q.n = [30, 60, 120][randInt(0, 2)];
  if (type === "tier") { q.tier = clamp(maxTierFound() - randInt(0, 2), 2, 11); q.n = randInt(1, 3); }
  if (type === "gold") q.n = Math.max(1000, Math.round(incomePerSec() * 120));
  if (type === "falling") q.n = 5;
  if (type === "depth") q.n = 40;
  if (type === "crit") q.n = 50;
  q.base = QUEST_KINDS[type].count(S, q);
  return q;
}
function fillQuests() { if (!S.police) return; S.quests = S.quests.filter(q => QUEST_KINDS[q.type]); while (S.quests.length < 3) S.quests.push(makeQuest()); }
const questProg = q => clamp(QUEST_KINDS[q.type].count(S, q) - q.base, 0, q.n);
function claimQuest(i) {
  const q = S.quests[i]; if (!q || questProg(q) < q.n) return;
  const b = QUEST_KINDS[q.type].badges, g = Math.floor(Math.max(200, incomePerSec()) * 30);
  S.badges += b; addGold(S, g); S.questsDone++;
  S.quests.splice(i, 1, makeQuest());
  SFX.buy(); SFX.levelUp(); confetti(30);
  floatText(W / 2, H / 2, `+${b} badge${b > 1 ? "s" : ""}  +${fmt(g)} Gold`, "#ffd447", 26);
  save();
}

// 9. ONE TICK OF GAME LOGIC (30 per second, like Scratch)
// =====================================================================
function tick() {
  T++;
  updateParts(lay.ground);
  updateMotes(lay, S.layer);
  if (game.shake > 0.1) game.shake *= 0.85; else game.shake = 0;
  if (ui.flash) { ui.flash.a *= 0.9; if (ui.flash.a < 0.01) ui.flash = null; }
  if (ui.banner && ++ui.banner.t >= ui.banner.max) ui.banner = null;
  if (ui.toasts.length && ++ui.toasts[0].t > 120) ui.toasts.shift();
  for (let i = ui.linger.length - 1; i >= 0; i--) if (--ui.linger[i].t <= 0) ui.linger.splice(i, 1);
  if (ui.layerCard > 0) ui.layerCard--;
  if (ui.resetArmed > 0) ui.resetArmed--;
  if (ui.trans) {
    const tr = ui.trans; tr.t++;
    if (tr.t === 14) {
      S.layer = tr.to; caveCache = null; music.layer = S.layer; falling.length = 0; floaters.length = 0; ui.linger = [];
      if (police.state === "stand") { police.state = "off"; police.quota = null; ui.dialog = null; }
      rock.pause = 0; newRock(); computeLayout();
      if (tr.announce) { ui.layerCard = 110; SFX.levelUp(); }
    }
    if (tr.t >= 28) ui.trans = null;
  }
  if (screen !== "game") return;

  S.time += DT;
  // mining (hold the mouse on the rock, or hold Space)
  if (rock.pause > 0 && --rock.pause === 0) newRock();
  if (game.coreBreakT > 0) game.coreBreakT--;
  game.cool -= DT;
  const L = LAYERS[S.layer];
  const coreDone = L.core && S.coreBroken;
  const canMine = !ui.modal && !ui.trans && !coreDone && rock.pause === 0;
  const mining = canMine && ((mouse.down && !mouse.ui && overRock()) || spaceDown);
  if (mining && game.cool <= 0) playerHit();
  // mini miners work on their own
  if (S.helper > 0 && !ui.trans && !coreDone) {
    game.helperAcc += helperHPS(S) * DT;
    while (game.helperAcc >= 1) { game.helperAcc -= 1; if (rock.pause === 0 && !(L.core && S.coreBroken)) helperHit(); }
  }
  for (let i = 0; i < game.minis.length; i++) game.minis[i] = Math.min(1, game.minis[i] + 0.12);
  // pickaxe swing: down on the hit, back up before the next one (his 2 costumes)
  game.swing = Math.min(1, game.swing + DT / Math.max(hitInterval(S) * 0.8, DT * 2));
  game.smear *= 0.7;
  rock.flash *= 0.7; rock.squash *= 0.75; rock.hurt *= 0.85; rock.pop = Math.min(1, rock.pop + 0.12);
  for (const f of floaters) f.life++;
  for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].life >= floaters[i].max) floaters.splice(i, 1);

  // drill income
  const pps = drillPPS(S);
  if (pps > 0) {
    addGold(S, pps * DT);
    if (++game.drillT >= 30) { game.drillT = 0; floatText(lay.drillX + 30 * lay.s, lay.ground - 90 * lay.s, "+" + fmt(pps), "#ffcc33", 15); }
    if (T % 4 === 0 && !L.core) burstSparks(lay.rockX + lay.R * 0.95, lay.ground - 48 * lay.s, 1, "#ffd27a", 4);
  }
  if (T % 30 === 0) { game.incomeHist.push(S.totalGold); if (game.incomeHist.length > 61) game.incomeHist.shift(); }

  // timed events
  if (ev.rush > 0 && --ev.rush === 0) { music.rush = false; linger("GOLD RUSH x3", 0, "#ffcc33"); }
  if (ev.frenzy > 0 && --ev.frenzy === 0) linger("PICKAXE FRENZY x2", 0, "#ff8a2a");
  if (ev.rush > 0 && T % 3 === 0) addPart({ k: "ember", x: rand() * W, y: H, vx: 0, vy: -2 - rand() * 2, c: "#ffcc33", life: 0, max: 120 });
  if ((S.layer === 2 || S.layer === 4) && T % 4 === 0) addPart({ k: "ember", x: rand() * W, y: H - 20, vx: (rand() - 0.5), vy: -1 - rand() * 1.5, c: "#ff8a2a", life: 0, max: 140 });
  // the next random event (paused while a menu, dialog or depth change is open)
  const quiet = !ui.dialog && !ui.modal && police.state === "off" && !ui.trans && !(L.core && !S.coreBroken) && !rock.boss;
  if (quiet && --ev.next <= 0) { ev.next = Math.round(30 * randInt(70, 140) / (1 + 0.15 * eventBoost(S))); startEvent(); }
  for (let i = falling.length - 1; i >= 0; i--) {
    const b = falling[i];
    if (b.landed) { if (++b.landed > 30 * 9) { if (b.kind === "rock") burstChips(b.x, b.y, 6, ROCK_PAL[0], 0.6); else burstSparks(b.x, b.y, 8, "#ff8a2a", 3); falling.splice(i, 1); } continue; }
    if (b.kind === "meteor") { b.x += b.vx; b.y += b.vy; b.vy += 0.15; if (T % 2 === 0) addPart({ k: "ember", x: b.x, y: b.y, vx: -b.vx * 0.2, vy: -1, c: "#ffb040", life: 0, max: 25 }); }
    else { b.vy += 0.5; b.y += b.vy; b.rot += b.vr; }
    if (b.y >= lay.ground - b.r) {
      b.y = lay.ground - b.r;
      if (b.kind === "meteor") { b.landed = 1; shake(6); burstSparks(b.x, b.y + b.r, 16, "#ffb040", 6); SFX.boom(); }
      else if (b.vy > 4) { b.vy *= -0.3; shake(4); burstChips(b.x, b.y + b.r, 4, ROCK_PAL[0], 0.6); playHis("punch", 0.3); }
      else b.landed = 1;
    }
  }

  // Rock police: first visit after a random 1-10 seconds (his Player2 wait)
  if (!S.police && police.state === "off" && S.time > introAt && !ui.modal && !ui.trans) startPolice("intro");
  if (police.state === "in") { police.walk += 0.25; police.x -= 6 * lay.s; if (police.x <= lay.policeX) { police.x = lay.policeX; police.state = "stand"; policeArrived(); } }
  else if (police.state === "stand") { police.x = lay.policeX; }
  else if (police.state === "out") { police.walk += 0.25; police.x += 7 * lay.s; if (police.x > W + 100) police.state = "off"; }
  quotaTick();
  if (ui.dialog) { const d = ui.dialog, line = d.lines[d.i][1]; if (d.ch < line.length) d.ch += 1.4; else if (++d.idle > 30 * 3.5) nextLine(); }
  if (ui.pendingEnding > 0 && --ui.pendingEnding <= 0) startPolice("ending");

  if (T % 30 === 0) { checkAch(); if (S.police && S.quests.length < 3) fillQuests(); }
  if (T % 60 === 0) save();
}
function nextLine() {
  const d = ui.dialog; if (!d) return;
  const line = d.lines[d.i][1];
  if (d.ch < line.length) { d.ch = line.length; return; }
  d.i++; d.ch = 0; d.idle = 0;
  if (d.i >= d.lines.length) { ui.dialog = null; if (d.onDone) d.onDone(); }
}

function rr(x, y, w, h, r) {

  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

}

function panel(x, y, w, h, r = 16, o = {}) {

  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, o.top || "#3a302a"); g.addColorStop(1, o.bot || "#211a16");
  ctx.fillStyle = g; ctx.fill();

  ctx.restore();
}
// a progress bar that always shows its true value, 0..100%

  const iw = (w - 6) * f;
  if (iw > 0.5) { rr(x + 3, y + 3, Math.max(iw, Math.min(h - 6, w - 6)), h - 6, (h - 6) / 2); ctx.fillStyle = color; ctx.fill(); }
}
const BTN_STYLE = {
  gold: ["#ffdf6a", "#f0a020", "#3a2200"], stone: ["#5e4e42", "#3a2f27", "#f4ead8"], red: ["#ff7a6a", "#c83a2a", "#fff"],
  green: ["#8aff6a", "#2fae3a", "#0e2a08"], dark: ["#2a2420", "#1a1512", "#7a6e62"],
};
function button(id, x, y, w, h, text, o = {}) {

  const a = anim(id + ":h", hov ? 1 : 0, 0.3), pr = anim(id + ":p", hov && mouse.down ? 1 : 0, 0.5);

// =====================================================================
// 11. DRAWING THE GAME WORLD
// =====================================================================
function drawWorld(t) {

  ctx.save();
  if (game.shake) ctx.translate((Math.random() - 0.5) * game.shake * 2, (Math.random() - 0.5) * game.shake * 2);
  drawCave(S.layer, t, game.px, game.py, lay, ev.vein > 0 ? 1 : 0);
  const s = lay.s, L = LAYERS[S.layer];
  const skin = SKINS.find(k => k.id === S.skin) || SKINS[0];
  if (!L.core) drawDrill(lay.drillX, lay.ground, s, S.drill, t, lay.rockX + lay.R * 0.9);
  if (L.core) {
    if (!S.coreBroken || game.coreBreakT > 0) {
      // while it breaks, the Core stays on screen with its bar at 0 for a moment
      const k = S.coreBroken ? 1 - game.coreBreakT / 40 : 0;
      ctx.save(); ctx.globalAlpha = 1 - k;
      drawCore(lay.rockX, lay.rockY, lay.R * (1 + k * 0.4), S.coreHP / CORE_HP, t, rock.flash);
      ctx.restore();

      bar(bx, by, bw, 22, S.coreHP / CORE_HP, "#ff8a2a", "rgba(0,0,0,0.6)");
      label(`CORE  ${fmt(S.coreHP)} HP`, lay.rockX, by + 12, 15, "#fff", "center", FONT_T, true, "middle");
    } else {

      ctx.beginPath(); ctx.ellipse(lay.rockX, lay.ground - 6, lay.R * 1.2, lay.R * 0.25, 0, 0, TAU); ctx.fillStyle = "#1a0a04"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "#ff8a2a"; ctx.stroke();
      label("The Core is broken!", lay.rockX, lay.rockY - 20, 28, "#ffd447", "center");
      label("Rebirth in the shop to rebuild the mine", lay.rockX, lay.rockY + 10, 16, "#d8cbb8", "center", FONT_B);
    }
  } else if (rock.pause === 0) {

    drawRock(lay.rockX, lay.rockY, R, ROCK_PAL[S.layer], rock.shape, rock.dmg / curHP(), { rot: rock.rot, flash: rock.flash, bright: rock.bright, sx: 1 + sq * 0.06, sy: 1 - sq * 0.06 });

  if (police.state !== "off") drawPolice(police.x, lay.ground, s, police.walk, t, -1, police.state === "stand" && !!ui.dialog);

// ---------- title screen ----------
const titleRock = { shape: rockShape(4242) };
let titleMineral = 0, titleBurstT = -1;
function drawTitle(t) {

  drawLighting(0, [W * 0.5, H * 0.45], t, lay, 0);
  const lx = W / 2, ly = H * 0.2;
  ctx.save(); ctx.translate(lx, ly + Math.sin(t * 1.2) * 4);
  label("YOUR AVERAGE", 0, 0, 40, "#d8cbb8", "center");
  ctx.font = `110px ${FONT_T}`; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.lineJoin = "round"; ctx.lineWidth = 22; ctx.strokeStyle = INK; ctx.strokeText("MINING GAME", 0, 104);
  const g = ctx.createLinearGradient(0, 20, 0, 110); g.addColorStop(0, "#fff2a0"); g.addColorStop(0.5, "#ffc21a"); g.addColorStop(1, "#c86a00");

  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.save(); ctx.beginPath(); ctx.rect(-500, 20, 1000, 42); ctx.clip(); ctx.fillText("MINING GAME", 0, 104); ctx.restore();

  ctx.restore();
  const bx = W / 2 - 360, by = H * 0.46;
  const modalOpen = !!ui.modal;
  button("play", bx, by, 280, 76, hasProgress() ? "CONTINUE" : "PLAY", { style: "gold", size: 38, disabled: ui.starting, always: false, onClick: startGame });
  if (hasProgress()) {
    button("reset", bx, by + 92, 280, 52, ui.resetArmed ? "Sure? Click again!" : "Reset save", { style: ui.resetArmed ? "red" : "stone", size: 22, disabled: ui.starting, onClick: () => { if (ui.resetArmed) { resetAll(); } else { ui.resetArmed = 90; SFX.click(); } } });
    const st = `${fmt(S.gold)} Gold  ·  Best ${fmt(S.high)}  ·  ${S.found.filter(n => n > 0).length}/${MINERALS.length} minerals`;
    label(st, bx + 140, by + 176, fitSize(st, 16, 400, FONT_B), "#cbbca8", "center", FONT_B);
  }
  button("tsnd", bx, by + (hasProgress() ? 196 : 92), 280, 52, "Sound", { icon: settings.muted ? "mute" : "sound", size: 22, disabled: ui.starting, onClick: () => { SFX.click(); openModal("sound"); } });

  label("Rock breaking sound: LordSonny (Pixabay)  ·  Pickaxe sound: CreatorsHome  ·  A game by Sixten", W / 2, H - 30, 14, "#9a8c7c", "center", FONT_B, false);

}
function resetAll() {
  S = newSave(); save(); ui.resetArmed = 0; playHis("rockBreak");
  game.goldShown = 0; game.incomeHist = []; falling.length = 0; floaters.length = 0;
  ev.rush = 0; ev.vein = 0; ev.frenzy = 0; music.rush = false; ev.next = 30 * 75;
  police.state = "off"; police.quota = null; rock.boss = false; rock.pause = 0; newRock();
}
function startGame() {
  if (ui.starting) return;
  ui.starting = true;
  initAudio(); SFX.click();
  ui.fadeTo = 1;
  setTimeout(() => {
    screen = "game"; ui.fadeTo = 0; ui.modal = null; ui.starting = false;
    music.layer = S.layer; caveCache = null; game.goldShown = S.gold;
    introAt = S.time + randInt(1, 10);
    rock.pause = 0; newRock(); computeLayout();
    fillQuests();
  }, 300);
}
function goTitle() { save(); ui.fadeTo = 1; setTimeout(() => { screen = "title"; ui.fadeTo = 0; ui.modal = null; ui.shop = false; ui.dialog = null; police.state = "off"; police.quota = null; falling.length = 0; music.layer = 0; caveCache = null; }, 300); }

// =====================================================================
// 12. MAIN LOOP
// =====================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.25, Math.max(0, (now - last) / 1000)); last = now;
  computeLayout();
  while (acc >= DT) { acc -= DT; tick(); }
  musicTick();
  // reset the transform every frame so drawing and clicking always line up
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.imageSmoothingEnabled = true;
  regions = [];
  const t = T / 30;
  try {
    if (screen === "title") drawTitle(t);
    else {
      drawWorld(t);
      drawShop();
      drawHUD();
      drawDialog();
      drawBanner();
      drawToasts();
      if (ui.layerCard > 0) {
        const k = ui.layerCard > 95 ? easeBack((110 - ui.layerCard) / 15) : ui.layerCard < 20 ? ui.layerCard / 20 : 1;
        ctx.save(); ctx.globalAlpha = clamp(k, 0, 1);
        label(`DEPTH ${S.layer + 1}`, lay.cx, H * 0.38, 26, "#cbbca8", "center");
        label(LAYERS[S.layer].name.toUpperCase(), lay.cx, H * 0.38 + 62, 64, "#ffd447", "center");
        ctx.restore();
      }
      if (ui.modal === "index") drawIndex();
      else if (ui.modal === "ach") drawAch();
      else if (ui.modal === "sound") drawSound();
      else if (ui.modal === "confirm") drawConfirm();
      else if (ui.modal === "ending") drawEnding();
      else if (ui.modal === "orders") drawOrders();
      else if (ui.modal === "perks") drawPerks();
    }
  } catch (e) { if (!frame.warned) { frame.warned = true; console.error(e); } }
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  if (ui.flash) { ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = clamp(ui.flash.a, 0, 1); ctx.fillStyle = ui.flash.c; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  ui.fade += (ui.fadeTo - ui.fade) * 0.2;
  if (Math.abs(ui.fadeTo - ui.fade) < 0.03) ui.fade = ui.fadeTo;   // fades really reach 100%
  let dark = ui.fade;
  if (ui.trans) dark = Math.max(dark, ui.trans.t < 14 ? ui.trans.t / 14 : 1 - (ui.trans.t - 14) / 14);
  if (dark > 0.005) { ctx.fillStyle = `rgba(0,0,0,${clamp(dark, 0, 1)})`; ctx.fillRect(0, 0, W, H); }
  const r = regionAt(mouse.x, mouse.y);
  hoverId = r && r.fn ? r.id : null;
  canvas.style.cursor = hoverId ? "pointer" : (screen === "game" && !ui.modal && (overRock() || falling.some(b => Math.hypot(mouse.x - b.x, mouse.y - b.y) < b.r * 1.3)) ? "crosshair" : "default");
  requestAnimationFrame(frame);
}
function boot() { requestAnimationFrame(frame); }
try { if (document.fonts && document.fonts.load) Promise.race([Promise.all([document.fonts.load(`40px "Lilita One"`), document.fonts.load(`800 20px "Nunito"`)]), new Promise(r => setTimeout(r, 1500))]).then(boot, boot); else boot(); } catch (e) { boot(); }
</script>
